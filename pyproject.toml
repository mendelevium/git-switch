[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-switch"
version = "0.1.0"
description = "CLI tool to switch between git user profiles"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
]

[project.scripts]
git-switch = "git_switch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/git_switch"]
